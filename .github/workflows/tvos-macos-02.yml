name: SuperTV 0.2.0 macOS and tvOS verification
run-name: SuperTV 0.2.0 dual-platform verification
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact 40-hex commit containing the sealed 0.2.0 source
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Read exact requested commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Attest and verify the original 0.2.0 bytes
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        shell: bash
        run: bash ci/release-02/verify.sh
      - name: Report boundaries
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'No artifacts, Apple account, Developer ID, notarization, or physical Apple TV install.' \
            'Mac stage: native bundle launch and separate AVFoundation/decoded-frame probe.' \
            'tvOS stage: XCTest simulator suite.' \
            'No external catalog, streaming integrations, audio listening or device tests.'
